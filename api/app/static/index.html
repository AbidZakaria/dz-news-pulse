<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DZ News Pulse</title>
<meta name="description" content="What Algerian news outlets are reporting, grouped into stories across French and Arabic.">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="/static/img/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<script>
  // Apply the saved theme and language before first paint (no flash).
  let theme = new URLSearchParams(location.search).get('theme');      // shareable: /?theme=light
  try {
    if (theme !== 'light' && theme !== 'dark') theme = localStorage.getItem('dz.theme');
  } catch (_) { /* storage blocked: keep the default */ }
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
</script>
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#view" data-i18n="skip">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main">
    <a class="brand" href="#/">
      <img src="/static/img/mark.svg" width="34" height="34" alt="">
      <span class="brand-name" translate="no">DZ News Pulse</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <p class="live" id="live" aria-live="polite"></p>
      <p class="foot-links">
        <a href="/docs" data-i18n="api_docs">API</a>
        <a href="https://github.com/AbidZakaria/dz-news-pulse" rel="noopener" target="_blank" translate="no">GitHub</a>
      </p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"></button>
      <form class="top-search" id="top-search" role="search">
        <label class="visually-hidden" for="top-q" data-i18n="search_label">Search the news</label>
        <span class="top-search-icon" aria-hidden="true"></span>
        <input id="top-q" name="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </form>
      <div class="top-actions">
        <div class="lang-switch" id="lang-switch" role="group"></div>
        <button class="icon-btn" id="theme-btn" type="button"></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<noscript><p style="padding:24px">This dashboard needs JavaScript. The data is also available from the API at <a href="/docs">/docs</a>.</p></noscript>
</body>
</html>
