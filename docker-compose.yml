# DZ News Pulse - full local stack:  docker compose up --build
#
#   Airflow UI  -> http://localhost:8080   (admin / admin, local use only)
#   Dashboard   -> http://localhost:8000   (API docs at /docs)
#   Warehouse   -> localhost:5433          (user/pass/db: news / news / news)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-only-change-me}
    # Where the pipeline code and the dbt project are mounted (see volumes)
    PYTHONPATH: /opt/airflow/pipeline
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    # Warehouse connection used by the ingestion code and by dbt
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: ${WAREHOUSE_DB:-news}
    WAREHOUSE_USER: ${WAREHOUSE_USER:-news}
    WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-news}
    # Optional: Slack/Discord-compatible webhook for failure alerts
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./dbt:/opt/airflow/dbt:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # Airflow's own metadata database (DAG runs, task states ...)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # The analytics warehouse: raw -> staging -> intermediate -> marts
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-news}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-news}
      POSTGRES_DB: ${WAREHOUSE_DB:-news}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./pipeline/dznews/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${WAREHOUSE_USER:-news}", "-d", "${WAREHOUSE_DB:-news}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  # Read-only analytics API + small dashboard on top of the marts schema
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-news}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-news}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-news}
    ports:
      - "8000:8000"
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  airflow-db-data:
  airflow-logs:
  warehouse-data:
