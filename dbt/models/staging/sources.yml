version: 2

sources:
  - name: raw
    description: Raw landing zone written by the Python ingestion code (never edited by hand).
    schema: raw
    tables:
      - name: articles
        description: One row per scraped article, deduplicated on a hash of the canonical URL.
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
