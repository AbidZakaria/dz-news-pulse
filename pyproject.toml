[tool.pytest.ini_options]
pythonpath = ["pipeline", "api"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs the embedding model (downloads ~1 GB on first use)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dznews", "app"]
